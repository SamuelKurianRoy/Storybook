<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Samuel Kurian Roy">
    <meta name="description" content="A digital storybook written by Samuel Kurian Roy.">
    <meta name="google-site-verification" content="V93p3d8kjwpqLx6T9Z8tIDA0wfcCkiuJUcC-GIsvvBI" />
    <title>Hosea and Gomer - A Story of Unfailing Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pigment-ochre: #c48c46;
            --pigment-clay: #8e4a31;
            --pigment-indigo: #2c364c;
            --pigment-ash: #e8e4db;
            --pigment-charcoal: #1a1817;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--pigment-charcoal);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(142, 74, 49, 0.15), transparent),
                url("https://www.transparenttextures.com/patterns/dark-matter.png");
            font-family: 'Crimson Text', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pigment-ash);
            overflow: hidden;
        }

        .chooser {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chooser h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--pigment-ash);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .chooser .subtitle {
            font-size: 1.1rem;
            opacity: 0.7;
            margin-bottom: 2.5rem;
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, var(--pigment-ochre), transparent);
            margin: 1.5rem auto;
            width: 60%;
        }

        .auto-msg {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--pigment-ochre);
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .btn-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .choose-btn {
            background: transparent;
            border: 1px solid var(--pigment-ochre);
            color: var(--pigment-ochre);
            padding: 1.2rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            min-width: 180px;
            position: relative;
            overflow: hidden;
        }

        .choose-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(196, 140, 70, 0.1), transparent);
            transition: left 0.5s;
        }

        .choose-btn:hover::before {
            left: 100%;
        }

        .choose-btn:hover {
            background: var(--pigment-ochre);
            color: var(--pigment-charcoal);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(196, 140, 70, 0.3);
        }

        .choose-btn .icon {
            font-size: 2rem;
        }

        .choose-btn .label {
            font-size: 0.65rem;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .auto-redirect {
            margin-top: 2rem;
            font-size: 0.85rem;
            opacity: 0.5;
        }

        .auto-redirect span {
            color: var(--pigment-ochre);
            font-weight: 600;
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(196, 140, 70, 0.2);
            margin: 1rem auto 0;
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-bar .fill {
            height: 100%;
            background: var(--pigment-ochre);
            width: 0%;
            transition: width 3s linear;
        }

        /* Grain overlay */
        .grain-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.3;
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>

    <svg class="grain-overlay" viewBox="0 0 100 100">
        <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noise)" />
    </svg>

    <div class="chooser">
        <h1>Hosea & Gomer</h1>
        <div class="subtitle">A Story of Unfailing Love</div>
        <div class="divider"></div>
        <p class="auto-msg" id="auto-msg">Detecting your device...</p>

        <div class="btn-group">
            <a href="index_bigger_screens.html" class="choose-btn" id="btn-desktop">
                <span class="icon">📖</span>
                Desktop
                <span class="label">Flipbook View</span>
            </a>
            <a href="index_mobile.html" class="choose-btn" id="btn-mobile">
                <span class="icon">📱</span>
                Mobile
                <span class="label">Single Page View</span>
            </a>
        </div>

        <div class="auto-redirect" id="auto-redirect">
            Redirecting to <span id="redirect-target">...</span> in <span id="countdown">3</span>s
        </div>
        <div class="loading-bar"><div class="fill" id="loading-fill"></div></div>
    </div>

    <script>
        const isMobile = window.innerWidth <= 768 || /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const target = isMobile ? 'index_mobile.html' : 'index_bigger_screens.html';
        const targetLabel = isMobile ? 'Mobile' : 'Desktop';

        document.getElementById('auto-msg').textContent = `${targetLabel} display detected`;
        document.getElementById('redirect-target').textContent = targetLabel;

        // Highlight the detected button
        const activeBtn = isMobile ? document.getElementById('btn-mobile') : document.getElementById('btn-desktop');
        activeBtn.style.borderColor = '#c48c46';
        activeBtn.style.background = 'rgba(196, 140, 70, 0.15)';

        // Start loading bar animation
        requestAnimationFrame(() => {
            document.getElementById('loading-fill').style.width = '100%';
        });

        // Countdown and auto-redirect
        let count = 3;
        const countdownEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            count--;
            countdownEl.textContent = count;
            if (count <= 0) {
                clearInterval(interval);
                window.location.href = target;
            }
        }, 1000);

        // Cancel auto-redirect on any click
        document.querySelectorAll('.choose-btn').forEach(btn => {
            btn.addEventListener('click', () => clearInterval(interval));
        });
    </script>
</body>
</html>
